<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
<title>Thank You | Cloute Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root{
    --navy:#0B1E39;
    --navy-2:#102A4C;
    --blue:#1E5FDB;
    --cyan:#17C3E6;
    --slate:#5B6B85;
  }
  body{
    font-family:'Inter',sans-serif;
    background:radial-gradient(1100px 500px at 85% -10%, rgba(30,95,219,.18), transparent 60%), var(--navy);
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem 1rem;
  }
  h1{font-family:'Sora',sans-serif;font-weight:800;}
  .check-icon{
    width:84px;height:84px;border-radius:50%;
    background:linear-gradient(135deg, var(--blue), var(--cyan));
    display:flex;align-items:center;justify-content:center;
    font-size:2.2rem;margin:0 auto 1.5rem;
  }
  p{color:#C6D1E6;}
  .btn-cloute{
    background:var(--blue);color:#fff;font-weight:600;
    border-radius:8px;padding:.7rem 1.6rem;border:none;
  }
  .btn-cloute:hover{background:var(--blue-light,#4A85F0);color:#fff;}
</style>
</head>
<body>
  <div class="text-center" style="max-width:520px;">
    <div class="check-icon"><i class="bi bi-check-lg"></i></div>
    <h1 class="mb-3">Thank You!</h1>
    <p class="mb-4">Your message has been received. Our team at Cloute Technologies will get back to you shortly.</p>
    <a href="index.html" class="btn btn-cloute">Back to Home</a>
  </div>
</body>
</html>
